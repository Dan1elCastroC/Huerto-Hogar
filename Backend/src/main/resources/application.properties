spring.application.name=hogar
server.port=8080
logging.file.name=hogar.log

# ── MySQL (igual que el ejemplo del profe) ───────────────────────────
spring.datasource.url=jdbc:mysql://localhost:3306/huertodb?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=root
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.generate-ddl=true
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.show-sql=false

# ── JWT ──────────────────────────────────────────────────────────────
jwt.secret=HuertoHogar2025_SuperSecretKey_32Chars!!
jwt.expiration-ms=86400000

# ── Swagger ──────────────────────────────────────────────────────────
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method

# ── CORS (React dev) ─────────────────────────────────────────────────
app.cors.allowed-origins=http://localhost:5173,http://localhost:3000
