<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head"><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Huerto Hogar</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" href="/css/estilos.css"></head><body>
<nav th:fragment="nav" class="navbar navbar-expand-lg navbar-dark bg-success shadow-sm">
  <div class="container">
    <a class="navbar-brand fw-bold" href="/">🌱 Huerto Hogar</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#nav">☰</button>
    <div id="nav" class="collapse navbar-collapse">
      <ul class="navbar-nav me-auto">
        <li class="nav-item"><a class="nav-link" href="/productos">Productos</a></li>
        <li class="nav-item"><a class="nav-link" href="/blog">Blog</a></li>
        <li class="nav-item"><a class="nav-link" href="/contacto">Contacto</a></li>
        <li class="nav-item" th:if="${session.logged}"><a class="nav-link" href="/carrito">🛒 Carrito</a></li>
        <li class="nav-item" th:if="${session.admin or session.vendedor}"><a class="nav-link" href="/admin">Administración</a></li>
      </ul>
      <div class="d-flex align-items-center gap-2">
        <a th:if="${!session.logged}" href="/login" class="btn btn-light btn-sm">Iniciar sesión</a>
        <a th:if="${!session.logged}" href="/registro" class="btn btn-outline-light btn-sm">Registrarse</a>
        <a th:if="${session.logged}" href="/perfil" class="btn btn-light btn-sm">Mi perfil</a>
        <a th:if="${session.logged}" href="/logout" class="btn btn-outline-light btn-sm">Salir</a>
      </div>
    </div>
  </div>
</nav>
<footer th:fragment="footer" class="mt-5 py-4 bg-dark text-white">
  <div class="container text-center"><small>Huerto Hogar · Proyecto académico</small></div>
</footer>
</body>
</html>
