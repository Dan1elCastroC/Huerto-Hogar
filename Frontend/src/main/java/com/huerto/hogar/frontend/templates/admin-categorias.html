<!DOCTYPE html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments :: head}"></head>
<body><nav th:replace="~{fragments :: nav}"></nav><main class="container py-5"><div class="d-flex justify-content-between"><h1>Categorías</h1><a href="/categorias/admin/nuevo" class="btn btn-success">Nueva categoría</a></div><table class="table mt-4"><tr><th>Nombre</th><th>Descripción</th><th>Acciones</th></tr><tr th:each="c:${categorias}"><td th:text="${c.nombre}"></td><td th:text="${c.descripcion}"></td><td><a class="btn btn-warning btn-sm" th:href="@{/categorias/admin/{id}/editar(id=${c.id})}">Editar</a> <a class="btn btn-danger btn-sm" th:href="@{/categorias/admin/{id}/eliminar(id=${c.id})}">Eliminar</a></td></tr></table></main></body></html>
