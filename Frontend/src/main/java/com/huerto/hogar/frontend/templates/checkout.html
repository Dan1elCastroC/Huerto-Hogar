<!DOCTYPE html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments :: head}"></head>
<body><nav th:replace="~{fragments :: nav}"></nav><main class="container py-5"><div class="col-md-7 mx-auto"><div class="card p-4"><h2>Finalizar compra</h2><div class="alert alert-danger" th:if="${error}" th:text="${error}"></div>
<form th:action="@{/carrito/checkout}" th:object="${form}" method="post"><label>Dirección de entrega</label><input class="form-control mb-3" th:field="*{direccionEntrega}" required><label>Fecha deseada</label><input type="date" class="form-control mb-3" th:field="*{fechaEntregaDeseada}"><label>Cupón</label><input class="form-control mb-3" th:field="*{codigoCupon}"><button class="btn btn-success">Confirmar compra</button></form></div></div></main></body></html>
