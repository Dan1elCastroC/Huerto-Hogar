<!DOCTYPE html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments :: head}"></head>
<body><nav th:replace="~{fragments :: nav}"></nav><main class="container py-5"><div class="row">
<div class="col-md-6"><img th:if="${producto.imagenUrl != null and !producto.imagenUrl.isBlank()}" th:src="${producto.imagenUrl}" class="img-fluid rounded"><div th:unless="${producto.imagenUrl != null and !producto.imagenUrl.isBlank()}" class="placeholder-large">🌱</div></div>
<div class="col-md-6"><small th:text="${producto.categoriaNombre}"></small><h1 th:text="${producto.nombre}"></h1><p th:text="${producto.descripcion}"></p><h3 class="text-success" th:text="'$'+${#numbers.formatDecimal(producto.precio,0,0)}"></h3><p>Stock: <span th:text="${producto.stock}"></span></p>
<form th:if="${session.logged}" action="/carrito/agregar" method="post"><input type="hidden" name="productoId" th:value="${producto.id}"><input type="number" name="cantidad" min="1" value="1" class="form-control mb-3" style="max-width:120px"><button class="btn btn-success">Agregar al carrito</button></form><a th:unless="${session.logged}" href="/login" class="btn btn-success">Inicia sesión para comprar</a></div></div></main></body></html>
