<!DOCTYPE html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments :: head}"></head>
<body><nav th:replace="~{fragments :: nav}"></nav><main class="container py-5"><h1>Mi perfil</h1><div class="card p-4 col-md-7"><p><b>Nombre:</b> <span th:text="${usuario.nombre+' '+usuario.apellidos}"></span></p><p><b>Correo:</b> <span th:text="${usuario.correo}"></span></p><p><b>RUN:</b> <span th:text="${usuario.run}"></span></p><p><b>Teléfono:</b> <span th:text="${usuario.telefono}"></span></p><p><b>Dirección:</b> <span th:text="${usuario.direccion}"></span></p><p><b>Región:</b> <span th:text="${usuario.region}"></span></p><p><b>Comuna:</b> <span th:text="${usuario.comuna}"></span></p></div></main></body></html>
