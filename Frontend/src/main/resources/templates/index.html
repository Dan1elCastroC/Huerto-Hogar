<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head}"></head>
<body>
<nav th:replace="~{fragments :: nav}"></nav>
<header class="hero">
  <div class="container py-5">
    <div class="row align-items-center">
      <div class="col-lg-7">
        <span class="badge bg-success mb-3">Huerto Hogar</span>
        <h1 class="display-4 fw-bold">Productos frescos para tu hogar.</h1>
        <p class="lead">Compra productos del huerto de forma simple, rápida y segura.</p>
        <a href="/productos" class="btn btn-success btn-lg">Ver productos</a>
      </div>
      <div class="col-lg-5 text-center display-1">🥬🥕🍅</div>
    </div>
  </div>
</header>
<main class="container py-5">
  <h2 class="mb-4">Productos destacados</h2>
  <div class="alert alert-warning" th:if="${error}" th:text="${error}"></div>
  <div class="row g-4">
    <div class="col-md-4 col-lg-3" th:each="p : ${productos}">
      <div class="card h-100 product-card">
        <img th:if="${p.imagenUrl != null and !p.imagenUrl.isBlank()}" th:src="${p.imagenUrl}" class="card-img-top product-img">
        <div th:unless="${p.imagenUrl != null and !p.imagenUrl.isBlank()}" class="placeholder-img">🌱</div>
        <div class="card-body">
          <small class="text-muted" th:text="${p.categoriaNombre}">Categoría</small>
          <h5 th:text="${p.nombre}">Producto</h5>
          <p class="fw-bold text-success" th:text="'$' + ${#numbers.formatDecimal(p.precio,0,0)}">$0</p>
          <a th:href="@{/productos/{id}(id=${p.id})}" class="btn btn-outline-success w-100">Ver detalle</a>
        </div>
      </div>
    </div>
  </div>
</main>
<footer th:replace="~{fragments :: footer}"></footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
