<!DOCTYPE html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments :: head}"></head>
<body><nav th:replace="~{fragments :: nav}"></nav><main class="container py-5"><div class="d-flex justify-content-between"><h1>Productos</h1><a href="/productos/admin/nuevo" class="btn btn-success">Nuevo producto</a></div><table class="table table-striped mt-4"><thead><tr><th>Código</th><th>Nombre</th><th>Precio</th><th>Stock</th><th>Acciones</th></tr></thead><tbody><tr th:each="p:${productos}"><td th:text="${p.codigo}"></td><td th:text="${p.nombre}"></td><td th:text="${p.precio}"></td><td th:text="${p.stock}"></td><td><a class="btn btn-warning btn-sm" th:href="@{/productos/admin/{id}/editar(id=${p.id})}">Editar</a> <a class="btn btn-danger btn-sm" th:href="@{/productos/admin/{id}/eliminar(id=${p.id})}" onclick="return confirm('¿Eliminar producto?')">Eliminar</a></td></tr></tbody></table></main></body></html>
