<!DOCTYPE html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments :: head}"></head>
<body><nav th:replace="~{fragments :: nav}"></nav><main class="container py-5"><h1>Usuarios</h1><table class="table table-striped mt-4"><tr><th>Nombre</th><th>Correo</th><th>Rol</th><th>Activo</th></tr><tr th:each="u:${usuarios}"><td th:text="${u.nombre+' '+u.apellidos}"></td><td th:text="${u.correo}"></td><td th:text="${u.rol}"></td><td th:text="${u.activo ? 'Sí':'No'}"></td></tr></table></main></body></html>
