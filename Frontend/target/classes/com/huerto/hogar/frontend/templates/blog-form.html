<!DOCTYPE html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments :: head}"></head>
<body><nav th:replace="~{fragments :: nav}"></nav><main class="container py-5"><div class="card p-4 col-md-9"><h2>Nueva publicación</h2><div class="alert alert-danger" th:if="${error}" th:text="${error}"></div><form th:action="@{/blog/admin/guardar}" th:object="${form}" method="post"><label>Título</label><input class="form-control mb-3" th:field="*{titulo}" required><label>Descripción</label><textarea class="form-control mb-3" rows="8" th:field="*{descripcion}" required></textarea><label>URL imagen</label><input class="form-control mb-3" th:field="*{imagenUrl}"><button class="btn btn-success">Publicar</button></form></div></main></body></html>
