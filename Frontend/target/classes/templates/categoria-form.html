<!DOCTYPE html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments :: head}"></head>
<body><nav th:replace="~{fragments :: nav}"></nav><main class="container py-5"><div class="card p-4 col-md-7"><h2 th:text="${id == null ? 'Nueva categoría' : 'Editar categoría'}"></h2><div class="alert alert-danger" th:if="${error}" th:text="${error}"></div><form th:action="${id == null ? '/categorias/admin/guardar' : '/categorias/admin/'+id+'/actualizar'}" th:object="${form}" method="post"><label>Nombre</label><input class="form-control mb-3" th:field="*{nombre}" required><label>Descripción</label><textarea class="form-control mb-3" th:field="*{descripcion}"></textarea><button class="btn btn-success">Guardar</button></form></div></main></body></html>
