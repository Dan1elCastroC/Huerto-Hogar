<!DOCTYPE html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments :: head}"></head>
<body><nav th:replace="~{fragments :: nav}"></nav>
<div class="container py-5"><div class="row justify-content-center"><div class="col-md-5"><div class="card shadow-sm"><div class="card-body p-4">
<h2>Iniciar sesión</h2><div class="alert alert-danger" th:if="${error}" th:text="${error}"></div>
<form th:action="@{/login}" th:object="${form}" method="post">
<label>Correo</label><input class="form-control mb-3" type="email" th:field="*{correo}" required>
<label>Contraseña</label><input class="form-control mb-3" type="password" th:field="*{contrasena}" required>
<button class="btn btn-success w-100">Ingresar</button></form>
<p class="mt-3 text-center">¿No tienes cuenta? <a href="/registro">Regístrate</a></p>
</div></div></div></div></div></body></html>
