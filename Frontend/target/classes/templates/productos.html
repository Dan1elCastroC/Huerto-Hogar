<!DOCTYPE html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments :: head}"></head>
<body><nav th:replace="~{fragments :: nav}"></nav><main class="container py-5">
<h1>Productos</h1><form class="row g-2 mb-4" method="get"><div class="col-md-6"><input class="form-control" name="q" th:value="${q}" placeholder="Buscar producto..."></div><div class="col-md-4"><select name="categoriaId" class="form-select"><option value="">Todas las categorías</option><option th:each="c:${categorias}" th:value="${c.id}" th:text="${c.nombre}" th:selected="${categoriaId == c.id}"></option></select></div><div class="col-md-2"><button class="btn btn-success w-100">Buscar</button></div></form>
<div class="row g-4"><div class="col-md-4 col-lg-3" th:each="p:${productos}"><div class="card h-100"><div class="placeholder-img" th:if="${p.imagenUrl == null or p.imagenUrl.isBlank()}">🌱</div><img th:if="${p.imagenUrl != null and !p.imagenUrl.isBlank()}" th:src="${p.imagenUrl}" class="product-img"><div class="card-body"><h5 th:text="${p.nombre}"></h5><p th:text="${p.descripcion}"></p><strong class="text-success" th:text="'$'+${#numbers.formatDecimal(p.precio,0,0)}"></strong><a class="btn btn-outline-success w-100 mt-3" th:href="@{/productos/{id}(id=${p.id})}">Ver producto</a></div></div></div></div>
</main></body></html>
