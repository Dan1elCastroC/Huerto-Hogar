<!DOCTYPE html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments :: head}"></head>
<body><nav th:replace="~{fragments :: nav}"></nav><main class="container py-5"><div class="col-md-7 mx-auto"><h1>Contacto</h1><div class="alert alert-success" th:if="${param.enviado}">Mensaje enviado correctamente.</div><div class="alert alert-danger" th:if="${error}" th:text="${error}"></div>
<form th:action="@{/contacto}" th:object="${form}" method="post"><label>Nombre</label><input class="form-control mb-3" th:field="*{nombre}" required><label>Correo</label><input type="email" class="form-control mb-3" th:field="*{correo}" required><label>Comentario</label><textarea class="form-control mb-3" rows="5" th:field="*{comentario}" required></textarea><button class="btn btn-success">Enviar mensaje</button></form></div></main></body></html>
